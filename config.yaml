sources:
  api:
    # DefiLlama hacks API became paywalled (402 Payment Required) after our
    # design date. Disabled until we wire an alternative (Rekt.news RSS,
    # DeFiYield API, etc.). Uncomment if you get a paid plan.
    # - name: defillama_hacks
    #   endpoint: "https://api.llama.fi/hacks"
    #   poll_interval_seconds: 300
    - name: ofac_sdn
      # Redirects from the old www.treasury.gov URL; httpx follow_redirects=True handles it.
      endpoint: "https://www.treasury.gov/ofac/downloads/sdn.xml"
      poll_interval_seconds: 86400

  telegram:
    - name: peckshield_tg
      username: "peckshield"
      poll_interval_seconds: 120
    # TODO: SlowMist_Team username does not resolve; find correct handle.
    # - name: slowmist_tg
    #   username: "SlowMist_Team"
    #   poll_interval_seconds: 120
    - name: certik_alert_tg
      username: "CertiKAlert"
      poll_interval_seconds: 120
    - name: whale_alert_tg
      username: "whale_alert_io"
      poll_interval_seconds: 120
    - name: scam_sniffer_tg
      username: "scam_sniffer"
      poll_interval_seconds: 120
    # TODO: wublockchain handle does not resolve; find correct handle.
    # - name: wublockchain_tg
    #   username: "wublockchain"
    #   poll_interval_seconds: 120
    - name: binance_ann_tg
      username: "binance_announcements"
      poll_interval_seconds: 300
    - name: bybit_ann_tg
      username: "Bybit_Announcements"
      poll_interval_seconds: 300

filter:
  min_severity: medium
  deny_keywords:
    - "airdrop"
    - "giveaway"

dedup:
  ttl_days: 7
