sources:
  api:
    # DefiLlama hacks API became paywalled (402 Payment Required) after our
    # design date. Disabled until we wire an alternative (Rekt.news RSS,
    # DeFiYield API, etc.). Uncomment if you get a paid plan.
    # - name: defillama_hacks
    #   endpoint: "https://api.llama.fi/hacks"
    #   poll_interval_seconds: 300
    - name: ofac_sdn
      # Redirects from the old www.treasury.gov URL; httpx follow_redirects=True handles it.
      endpoint: "https://www.treasury.gov/ofac/downloads/sdn.xml"
      poll_interval_seconds: 86400
    # Forta Network: decentralised on-chain detection bots, public GraphQL.
    # Severity comes from the alert (HIGH/CRITICAL only), so it bypasses the
    # keyword-based scorer and reliably clears min_severity=medium.
    - name: forta
      endpoint: "https://api.forta.network/graphql"
      poll_interval_seconds: 60
    # Rekt.news: weekly post-mortems of major exploits. Low frequency,
    # high signal — every entry is by definition an incident worth pushing.
    - name: rekt_news
      endpoint: "https://rekt.news/rss/feed.xml"
      poll_interval_seconds: 3600

  telegram:
    # @peckshield is the discussion group (low-signal team chatter, retweets).
    # @PeckShieldAlert is the broadcast channel where actual hack alerts go.
    - name: peckshield_tg
      username: "PeckShieldAlert"
      poll_interval_seconds: 120
    - name: scam_sniffer_tg
      username: "scam_sniffer"
      poll_interval_seconds: 120
    # Disabled after 26h prod observation: 60 messages ingested, 0 passed
    # severity filter. These channels broadcast off-topic content for our
    # use case (large-transfer notifications and exchange listings/maintenance,
    # not security incidents). Re-enable only with a per-source severity policy.
    # - name: whale_alert_tg
    #   username: "whale_alert_io"
    #   poll_interval_seconds: 120
    # - name: binance_ann_tg
    #   username: "binance_announcements"
    #   poll_interval_seconds: 300
    # - name: bybit_ann_tg
    #   username: "Bybit_Announcements"
    #   poll_interval_seconds: 300
    # @CertiKAlert resolves to "Certik Alert (Meme)" -- joke channel, not the
    # real alerts. Real-time CertiK exploit alerts are on X (@CertiKAlert there)
    # not Telegram. Plan: pull via RSSHub→Twitter once we add that path.
    # - name: certik_alert_tg
