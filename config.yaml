sources:
  api:
    # DefiLlama hacks API became paywalled (402 Payment Required) after our
    # design date. Disabled until we wire an alternative (Rekt.news RSS,
    # DeFiYield API, etc.). Uncomment if you get a paid plan.
    # - name: defillama_hacks
    #   endpoint: "https://api.llama.fi/hacks"
    #   poll_interval_seconds: 300
    - name: ofac_sdn
      # Redirects from the old www.treasury.gov URL; httpx follow_redirects=True handles it.
      endpoint: "https://www.treasury.gov/ofac/downloads/sdn.xml"
      poll_interval_seconds: 86400
    # Forta Network: decentralised on-chain detection bots, public GraphQL.
    # Severity comes from the alert (HIGH/CRITICAL only), so it bypasses the
    # keyword-based scorer and reliably clears min_severity=medium.
    - name: forta
      endpoint: "https://api.forta.network/graphql"
      poll_interval_seconds: 60
    # Rekt.news: weekly post-mortems of major exploits. Low frequency,
    # high signal — every entry is by definition an incident worth pushing.
    - name: rekt_news
      endpoint: "https://rekt.news/rss/feed.xml"
      poll_interval_seconds: 3600

  # All TG-channel ingestion (peckshield_tg, scam_sniffer_tg, etc.) was retired
  # in favour of X — same accounts post the same content faster on Twitter, and
  # the userbot was burning a TG session per IP. The TG bot is still used as
  # the publish/notification channel; only the userbot ingest is gone.
  telegram: []

  x:
    enabled: true
    websocket_url: "wss://ws.twitterapi.io/twitter/tweet/websocket"
    rest_base_url: "https://api.twitterapi.io"
    poll_interval_seconds: 600
    ws_reconnect_min_seconds: 90
    ws_max_consecutive_failures: 5
    degrade_recheck_seconds: 1800
    # Tier S: lone researchers (force severity>=high)
