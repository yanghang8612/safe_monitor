[project]
name = "safe-monitor"
version = "0.1.0"
description = "Real-time Web3 security event monitor and alerter"
requires-python = ">=3.11,<3.12"
dependencies = [
  "telethon>=1.35",
  "python-telegram-bot>=21",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "structlog>=24",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "aiosqlite>=0.20",
  "pyyaml>=6",
  "tenacity>=8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "vcrpy>=6",
  "respx>=0.21",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke: end-to-end smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
